name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install tmux if missing
        run: command -v tmux || (sudo apt-get update && sudo apt-get install -y tmux)
      - run: npm ci
      - run: npm run build
      - name: Built extension matches src
        run: git diff --exit-code copilot-min/
      - run: shellcheck install.sh bin/copilot-min
      - name: End-to-end test against a fake model (no AI, no secrets)
        run: npm test
